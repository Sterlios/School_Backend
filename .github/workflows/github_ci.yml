# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: github_ci
env:
  DOCKER_DRIVER: overlay2
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME
  GITLAB_USER: oauth2

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          
      - name: Restore 
        uses: actions/checkout@v4
      - run: dotnet restore School_Backend.slnx 
      - run: dotnet restore tests/Domain.Tests/Domain.Tests.csproj
      - run: dotnet restore tests/Application.Tests/Application.Tests.csproj
      
      - name: Build
        run: dotnet build School_Backend.slnx --configuration Release --no-restore
        
      - name: Test
        run: dotnet test School_Backend.slnx --configuration Release --no-build
  